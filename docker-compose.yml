services:
  exporter:
    build: .
    image: local/genieacs-exporter:latest
    environment:
      - GENIEACS_API_URL=http://genieacs-nbi:7557
      - POLL_INTERVAL=30
      - DEVICE_QUERY_FILTER={}
      - BATCH_SIZE=200
      - WORKERS=100
      - STALE_SECONDS=300
      - VM_INGEST_URL=http://victoriametrics:8428/api/v1/import/prometheus
      - SHARD_COUNT=1
      - SHARD_INDEX=0
    networks:
      - monitoring
    restart: unless-stopped

  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    ports:
      - "8428:8428"
    networks:
      - monitoring
    restart: unless-stopped

networks:
  monitoring:
    driver: bridge

