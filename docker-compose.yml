version: "3.8"
services:
  genieacs-exporter:
    build: .
    image: local/genieacs-exporter:latest
    environment:
      - GENIEACS_API_URL=http://genieacs-nbi:7557
      - POLL_INTERVAL=30
      - DEVICE_QUERY_FILTER={}
      - BATCH_SIZE=200
      - WORKERS=100
      - STALE_SECONDS=300
      - SHARD_COUNT=1
      - SHARD_INDEX=0
    networks:
      - monitoring
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:2.47.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring
    restart: unless-stopped

  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    ports:
      - "8428:8428"
    networks:
      - monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.0.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - monitoring
    restart: unless-stopped

networks:
  monitoring:
    driver: bridge

volumes:
  grafana-data:
